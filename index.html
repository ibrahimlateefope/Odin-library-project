<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,close,search,delete,done_all"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="menu.css" />
    <title>My Library</title>
  </head>
  <body data-theme="dark">
    <div class="container">
      <header>
        <div class="header-top">
          <h1>My Library</h1>
          <div class="search-bar">
            <input
              type="text"
              class="search-input"
              placeholder="Search"
            /><button class="search-btn">
              <span class="material-symbols-outlined"> search </span>
            </button>
          </div>
          <nav>
            <div class="nav-el">
              <a href="#">Dashboard</a>
            </div>
            <div class="nav-el">
              <a href="#"> My Books </a>
            </div>
            <div class="nav-el">
              <a href="#">Wishlist</a>
            </div>
            <div class="nav-el"><a href="">Settings</a></div>
          </nav>
          <div class="header-top_corner">
            <img src="https://i.pravatar.cc/90?img=25" alt="profile-img" />
            <button class="add-btn">
              Add Book
              <span class="material-symbols-outlined add">add</span>
            </button>
          </div>
          <button class="menu">
            <svg viewBox="0 0 64 48">
              <path d="M19,15 L45,15 C70,15 58,-2 49.0177126,7 L19,37"></path>
              <path d="M19,24 L45,24 C61.2371586,24 57,49 41,33 L32,24"></path>
              <path d="M45,33 L19,33 C-8,33 6,-2 22,14 L45,37"></path>
            </svg>
          </button>
        </div>
        <div class="header-bottom">
          <div class="header-info">
            <span class="header-total">Total Books</span>
            <span class="header-total_num">(142)</span>
          </div>
          <div class="header-info">
            <span class="header-total">Read</span>
            <span class="header-total_num">(98)</span>
          </div>
          <div class="header-info">
            <span class="header-total">Unread</span>
            <span class="header-total_num">(44)</span>
          </div>
        </div>
      </header>
      <main>
        <h2>Your Books</h2>
        <div class="user-books"></div>
        <h2>Recommended for You</h2>
        <div class="recommendations"></div>
      </main>
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="add new book"
        class="modal"
      >
        <div class="modal-header">
          <h2 class="modal-title">Add New Book</h2>
          <span class="material-symbols-outlined"> close </span>
        </div>
        <form action="" novalidate>
          <label for="modal-book-title">Title</label>
          <input
            type="text"
            name="modal-book-title"
            id="modal-book-title"
            placeholder="Title"
          />
          <label for="modal-author">Author</label>
          <input
            type="text"
            name="modal-author"
            id="modal-author"
            placeholder="Author"
          />
          <label for="modal-link">Reading Link</label>
          <input
            type="text"
            name="modal-link"
            id="modal-link"
            placeholder="Link"
          />
          <p>Read Status:</p>
          <div class="radios">
            <div>
              <input type="radio" name="modal-read" value="read" id="read" />
              <label for="read">Read</label>
            </div>
            <div>
              <input
                type="radio"
                name="modal-read"
                value="in-progress"
                id="in-progress"
                checked
              />
              <label for="in-progress">In-progress</label>
            </div>
            <div>
              <input
                type="radio"
                name="modal-read"
                value="unread"
                id="unread"
              />
              <label for="unread">Unread</label>
            </div>
            <div class="overlay"></div>
          </div>
          <button type="submit" class="modal-submit">Save Book</button>
        </form>
      </div>
      <div class="add-btn-overlay">
        <span class="material-symbols-outlined"> add </span>
      </div>
    </div>
    <script src="index.js" type="module"></script>
    <script src="ui.js"></script>
  </body>
</html>
